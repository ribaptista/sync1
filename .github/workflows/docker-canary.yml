name: docker-canary

# The Dockerfile pins exact Debian apt package versions for ffmpeg/
# imagemagick (see its own header comment) -- intentional, so a build
# fails loudly rather than silently drifting, but that means a routine
# Debian trixie security update can break `docker build` with no one
# noticing until the middle of an actual release. This runs the same
# build weekly, with no push, purely to catch that early and file an
# issue -- see docs/architecture/release.md's "apt pins going stale"
# section for the fix procedure.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # amd64 only, no push: this exists purely to exercise the pinned
      # `apt-get install` lines before a real release does. `continue-on-
      # error` so the issue-filing step below still runs on failure --
      # the job itself is still failed explicitly at the end.
      - name: Build (amd64, no push)
        id: build
        continue-on-error: true
        run: docker buildx build --platform linux/amd64 -t sync1-canary:local .

      - name: File or update an issue on failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Dockerfile apt pins stale"
          BODY_FILE="$(mktemp)"
          {
            echo "The weekly Docker canary build failed: $RUN_URL"
            echo
            echo "This almost always means the pinned \`IMAGEMAGICK_VERSION\`/\`FFMPEG_VERSION\` ARGs"
            echo "in the Dockerfile no longer exist in Debian trixie's apt archive (superseded by a"
            echo "security update). See docs/architecture/release.md's \"apt pins going stale\""
            echo "section for the fix procedure."
          } > "$BODY_FILE"

          EXISTING="$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Fail the job if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
